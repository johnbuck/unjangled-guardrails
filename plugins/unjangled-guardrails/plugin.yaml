name: unjangled-guardrails
version: "0.1.0"
description: "Auto-mode gate for Hermes: shells out to the unjangled-guardrails fork (node cli.js hook --agent hermes) so every non-read-only tool call is risk-scored by the local SemIf Jev-class backend before execution, and tool results are scanned for AI-directed (prompt-injection/canary) content. Denies block via pre_tool_call; injection findings are prepended to the model-visible result via transform_tool_result. Ask-level calls escalate to Hermes' human-approval gate via the approve directive when an approver is configured (else they deny). When the backend is down, GUARD_FALLBACK picks the posture: rules (default — the built-in offline rules gate), layered (explicit opt-in pass-through to an external heuristic stack), or closed (deny-all; legacy GUARD_FAIL_CLOSED=1)."
author: "unjangled-guardrails maintainers"
kind: standalone
hooks:
  - pre_tool_call
  - post_tool_call
  - transform_tool_result

